name: CRAP score

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET CRAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify CRAP fixtures
        run: dotnet run scripts/crap/CheckCobertura.cs -- --self-test

      - name: Test with coverage
        run: dotnet test JeffyGPT.slnx --collect:"XPlat Code Coverage" --results-directory artifacts/coverage --settings coverlet.runsettings

      - name: Score CRAP
        run: dotnet run scripts/crap/CheckCobertura.cs -- artifacts/coverage

  web:
    name: TypeScript CRAP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/JeffyGPT/JeffyGPT.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/JeffyGPT/JeffyGPT.Web/package-lock.json

      - run: npm ci
      - run: npm run crap
